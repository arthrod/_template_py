[project]
name = "template_py"
version = "0.1.0"
authors = [{ name = "Arthur Souza Rodrigues", email = "arthrod@umich.edu" }]
description = "Py scaffold."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
  "rich-argparse>=1.7.0",
  "termcolor>=3.1.0",
  "tomli>=2.2.1",
  "typeshed-client @ git+https://github.com/JelleZijlstra/typeshed_client@0f5f71120433ecb18f370a1627710f928d5c7893",
  # So that we can add docs for `typing_extensions` APIs:
  "typing_extensions>=4.16.0rc1",
  # for dynamically installing typeshed packages
  "uv",
]


[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project.urls]
"Homepage" = "https://github.com/arthrod/_scaffold"


[project.scripts]
add-docstrings = "add_docstrings:_main"


[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "covdefaults==2.3.0",
  "coverage==7.14.1",
  "mypy==2.1.0",
  "bandit>=1.9.4",
  "ruff>=0.15.20",
  "ty>=0.0.55",
]


[tool.uv]
required-version = ">=0.11.21"


[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
xfail_strict = true

[tool.coverage.run]
# Note that many settings are automatically added due to this plugin
plugins = ["covdefaults"]

[tool.coverage.report]
# This extends the lines that covdefaults already excludes
exclude_lines = ['^if typing.TYPE_CHECKING:$']
fail_under = 90

[tool.coverage.covdefaults]
subtract_omit = "*/__main__.py"

[tool.ruff]
extend-exclude = ["__pycache__", "build", "dist"]
fix = true
preview = true
target-version = "py314"
line-length = 90
src = ["template_py", "tests"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "B9",
  "D",
  "E",
  "EXE",
  "F",
  "I",
  "ISC",
  "PGH",
  "PYI",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "PLW0127",
  "FURB101",
  "FURB103",
  "PLW1510",
]
ignore = [
  # Unnecessarily strict/pedantic
  "D107",
  "D202",
  # These are all enforced by, or incompatible with, the ruff formatter:
  "E203",
  "E501",
  "W291",
  "W293",
  # It's often necessary to compare types instead of using isinstance()
  "E721",
  "RUF005",
  # Let mypy/pyright complain about blanket type ignores or implicit optional
  "PGH003",
  "RUF013",
]
unfixable = [
  "F841", # unused variable. ruff keeps the call, but mostly we want to get rid of it all
  "F601", # automatic fix might obscure issue
  "F602", # automatic fix might obscure issue
  "B018", # automatic fix might obscure issue
  "PLW1510", # automatic fix might obscure issue
  "RUF017", # Ruff's fix is faster, but I prefer using itertools.chain_from_iterable
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "D"]

[tool.mypy]
files = ["src", "tests"]
strict = "true"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
division-by-zero = "error"
unused-ignore-comment = "error"

ambiguous-protocol-member = "warn"
deprecated = "warn"
ignore-comment-unknown-rule = "warn"
ineffective-final = "warn"
invalid-enum-member-annotation = "warn"
invalid-ignore-comment = "warn"
invalid-legacy-positional-parameter = "warn"
invalid-named-tuple-override = "warn"
mismatched-type-name = "warn"
possibly-missing-implicit-call = "warn"
possibly-missing-submodule = "warn"
redundant-cast = "warn"
redundant-final-classvar = "warn"
undefined-reveal = "warn"
unresolved-global = "warn"
unsupported-base = "warn"
unused-awaitable = "warn"

unused-type-ignore-comment = "warn"
useless-overload-body = "warn"

possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

unsupported-dynamic-base = "warn"
